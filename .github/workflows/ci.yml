name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install "ruff>=0.6"

      - name: Ruff check
        run: ruff check scripts/md_to_docx tests

      - name: Ruff format (check)
        run: ruff format --check scripts/md_to_docx tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and mypy
        run: pip install -e ".[dev]"

      - name: Mypy (progressive public surface)
        run: mypy

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Audit dependencies in clean venv
        run: |
          python -m venv /tmp/md2docx-audit
          /tmp/md2docx-audit/bin/pip install -U pip setuptools wheel
          /tmp/md2docx-audit/bin/pip install -e ".[dev,mcp,web]"
          /tmp/md2docx-audit/bin/pip-audit --progress-spinner off

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Build template assets
        run: |
          pip install markdown-it-py mdit-py-plugins python-docx latex2mathml pillow
          PYTHONPATH=scripts python -m md_to_docx.presets_build

      - name: Install package and dev dependencies
        run: pip install -e ".[dev,mcp,web]"

      - name: Run tests
        run: |
          if [ "${{ matrix.python-version }}" = "3.12" ]; then
            pytest tests/ -v \
              --cov=md_to_docx \
              --cov-report=term-missing:skip-covered \
              --cov-fail-under=83
          else
            pytest tests/ -v
          fi

      - name: Verify MCP entry
        run: |
          md-to-docx mcp --help
          python -m md_to_docx.mcp --help

      - name: Verify bin/convert entry point
        run: ./bin/convert --help

      - name: Verify --version flag
        run: python -m md_to_docx --version

      - name: Verify --help flag
        run: python -m md_to_docx --help

      - name: Sample conversion
        run: |
          python -m md_to_docx tests/fixtures/sample.md --preset technical
          python -m md_to_docx tests/fixtures/comprehensive.md --preset professional

          # Verify output files exist and are not empty
          test -f tests/fixtures/sample.docx
          test -f tests/fixtures/comprehensive.docx
          test -s tests/fixtures/sample.docx
          test -s tests/fixtures/comprehensive.docx

          echo "Sample conversions succeeded and produced non-empty output"

      - name: Convert examples
        run: |
          bash scripts/demo/build_examples.sh
          for f in examples/*/example.docx; do test -s "$f"; done

      - name: Validate GitHub Action (local)
        run: |
          pip install -e .
          md-to-docx examples/meeting-notes/example.md --preset technical --output-dir dist/docx
          test -s dist/docx/example.docx

      - name: Validate plugin example
        run: |
          md-to-docx tests/fixtures/sample.md \
            --plugin examples/plugins/uppercase_headings.py \
            --output-dir /tmp/p3b-plugin-test
          test -s /tmp/p3b-plugin-test/sample.docx

      - name: Validate community templates
        run: |
          for f in templates/*/sample.md; do
            dir=$(dirname "$f")
            name=$(basename "$f" .md)
            md-to-docx "$f" --template "$dir/template.docx" --output-dir /tmp/templates-test
            test -s "/tmp/templates-test/${name}.docx"
          done

      - name: Validate editor manifests
        run: |
          python -m json.tool editors/vscode/package.json > /dev/null
          python -m json.tool editors/obsidian/manifest.json > /dev/null

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: browser-extension/package-lock.json
      - name: Extension adapter tests
        run: |
          cd browser-extension
          npm ci
          npm test

  mermaid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Chromium deps for mmdc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 fonts-liberation
      - name: Install mmdc
        run: npm install -g @mermaid-js/mermaid-cli
      - name: Install package
        run: |
          pip install markdown-it-py mdit-py-plugins python-docx latex2mathml pillow
          PYTHONPATH=scripts python -m md_to_docx.presets_build
          pip install -e ".[dev]"
      - name: Run Mermaid-marked tests
        run: pytest tests/ -v -m mermaid
