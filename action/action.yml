name: md-to-docx
description: Compile Markdown to professional DOCX
inputs:
  input:
    description: Markdown file or directory to convert
    required: true
  preset:
    description: Template preset
    required: false
    default: technical
  output-dir:
    description: Output directory for .docx files
    required: false
    default: dist/docx
  toc:
    description: Force table of contents (true/false/omit)
    required: false
    default: ""
  numbering:
    description: Enable heading numbering (true/false)
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: |
          ${{ github.action_path }}/../pyproject.toml
    - name: Install md-to-docx
      run: pip install "${{ github.action_path }}/.."
      shell: bash
    - name: Convert Markdown to DOCX
      run: |
        set -euo pipefail
        args=("${{ inputs.input }}" --preset "${{ inputs.preset }}" --output-dir "${{ inputs.output-dir }}")
        if [ -n "${{ inputs.toc }}" ]; then
          if [ "${{ inputs.toc }}" = "true" ]; then
            args+=(--toc)
          elif [ "${{ inputs.toc }}" = "false" ]; then
            args+=(--no-toc)
          else
            echo "error: toc must be true, false, or empty" >&2
            exit 2
          fi
        fi
        if [ -n "${{ inputs.numbering }}" ]; then
          if [ "${{ inputs.numbering }}" = "true" ]; then
            args+=(--numbering)
          elif [ "${{ inputs.numbering }}" != "false" ]; then
            echo "error: numbering must be true, false, or empty" >&2
            exit 2
          fi
        fi
        md-to-docx "${args[@]}"
      shell: bash
